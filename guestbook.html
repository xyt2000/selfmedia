<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - 我们的故事</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 动画图像 -->
    <div class="floating-animations">
        <div class="anim-img anim-left" id="anim1">
            <img src="bubu.jpg" alt="动画1">
            <audio id="sound1" src="bubu.mp3"></audio>
        </div>
        <div class="anim-img anim-right" id="anim2">
            <img src="yier.jpg" alt="动画2">
            <audio id="sound2" src="yier.mp3"></audio>
        </div>
    </div>

    <!-- 返回按钮 -->
    <a href="index.html" class="back-btn">
        <span>←</span> 返回主页
    </a>

    <!-- 留言板页面 -->
    <main class="guestbook-page">
        <header class="guestbook-header">
            <h1><span aria-hidden="true">💌</span> 留言板</h1>
            <p>写下想说的话吧</p>
        </header>

        <!-- 留言表单 -->
        <form class="message-form" id="messageForm">
            <div class="form-group">
                <input type="text" id="authorName" placeholder="你是？" maxlength="20" required>
            </div>
            <div class="form-group">
                <textarea id="messageContent" placeholder="想对我说什么？" maxlength="500" required></textarea>
                <div class="char-count"><span id="charCount">0</span>/500</div>
            </div>
            <div class="form-actions">
                <label class="mood-select">
                    <span>选择心情：</span>
                    <div class="mood-icons">
                        <span class="mood-icon" data-mood="happy">😊</span>
                        <span class="mood-icon" data-mood="love">😍</span>
                        <span class="mood-icon" data-mood="sad">😢</span>
                        <span class="mood-icon" data-mood="shy">😳</span>
                        <span class="mood-icon" data-mood="excited">🤩</span>
                    </div>
                    <input type="hidden" id="selectedMood" value="love">
                </label>
                <button type="submit" class="submit-btn">
                    <span>发送留言</span>
                </button>
            </div>
        </form>

        <!-- 留言列表 -->
        <div class="messages-container">
            <h3><span aria-hidden="true">💕</span> 我们的留言 <span class="message-count">(<span id="messageCount">0</span>)</span></h3>
            <div class="messages-list" id="messagesList">
                <!-- 示例留言 -->
                <article class="message-card">
                    <div class="message-header">
                        <span class="message-author">男朋友</span>
                        <span class="message-mood">😍</span>
                        <time class="message-time">2024年5月20日</time>
                    </div>
                    <p class="message-content">今天是我们的一周年纪念日，感谢你这一年的陪伴，希望我们能一直走下去 💕</p>
                </article>
                <article class="message-card">
                    <div class="message-header">
                        <span class="message-author">女朋友</span>
                        <span class="message-mood">😊</span>
                        <time class="message-time">2024年4月15日</time>
                    </div>
                    <p class="message-content">今天的晚餐很好吃，下次还要去！</p>
                </article>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/main.js"></script>
    <script>
        // 初始化 Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyDhP9QgkL3gpE2QNTtN53dwig7gG11DtTs",
            authDomain: "xyt-lcy.firebaseapp.com",
            projectId: "xyt-lcy",
            storageBucket: "xyt-lcy.firebasestorage.app",
            messagingSenderId: "684683627358",
            appId: "1:684683627358:web:b39c71f9b309932797ddcf",
            measurementId: "G-7VF0V913RJ"
        });

        const db = firebase.firestore();

        initParticles();
        initGuestbook(db);

        // 动画图像点击音效
        document.querySelectorAll('.anim-img').forEach(img => {
            img.addEventListener('click', () => {
                const audio = img.querySelector('audio');
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }
            });
        });
    </script>
</body>
</html>
