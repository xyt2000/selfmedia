<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的故事 - 时间轴 💕</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 动画图像 -->
    <div class="floating-animations">
        <div class="anim-img anim-left" id="anim1">
            <img src="bubu.jpg" alt="动画1">
            <audio id="sound1" src="bubu.mp3"></audio>
        </div>
        <div class="anim-img anim-right" id="anim2">
            <img src="yier.jpg" alt="动画2">
            <audio id="sound2" src="yier.mp3"></audio>
        </div>
    </div>

    <!-- 返回按钮 -->
    <a href="index.html" class="back-btn">
        <span>←</span> 返回主页
    </a>

    <!-- 时间轴页面 -->
    <main class="timeline-page">
        <header class="timeline-header">
            <h1>我们的时间轴</h1>
        </header>

        <div class="timeline" id="timeline">
            <!-- JS 动态渲染 -->
        </div>
    </main>

    <!-- 时间轴详情模态框 -->
    <div class="modal-overlay" id="timelineModal">
        <div class="modal-content">
            <button class="modal-close">×</button>
            <div class="modal-gallery">
                <button class="gallery-nav gallery-prev" id="timelineGalleryPrev">&#10094;</button>
                <div class="gallery-image-wrap">
                    <img src="" alt="回忆照片" class="modal-image" id="timelineModalImage">
                </div>
                <button class="gallery-nav gallery-next" id="timelineGalleryNext">&#10095;</button>
                <div class="gallery-dots" id="timelineGalleryDots"></div>
            </div>
            <div class="gallery-caption" id="timelineGalleryCaption"></div>
            <div class="modal-date" id="timelineModalDate"></div>
            <h2 class="modal-title" id="timelineModalTitle"></h2>
            <p class="modal-text" id="timelineModalText"></p>
        </div>
    </div>

    <!-- 音乐控制按钮（可选） -->
    <button class="music-control" id="musicBtn">🎵</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // 初始化粒子
        initParticles();

        // 初始化时间轴
        initTimeline();

        // 初始化时间轴模态框
        initTimelineModals();

        // 初始化音乐控制（可选）
        initMusic();

        // 动画图像点击音效
        document.querySelectorAll('.anim-img').forEach(img => {
            img.addEventListener('click', () => {
                const audio = img.querySelector('audio');
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }
            });
        });
    </script>
</body>
</html>
