<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
"// 我想要添加一个纪念日祝福弹窗功能" 

    <title>我们的故事 💕</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 主页面容器 -->
    <main class="home">
        <div class="home-content">
            <!-- 标题 -->
            <h1 class="title">
                <span class="title-name">🌸 你的名字</span>
                <span class="title-heart">&</span>
                <span class="title-name">你的名字 🌸</span>
            </h1>

            <!-- 纪念日倒计时 -->
            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <span class="countdown-number" id="days">0</span>
                    <span class="countdown-label">天</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="hours">0</span>
                    <span class="countdown-label">时</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="minutes">0</span>
                    <span class="countdown-label">分</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="seconds">0</span>
                    <span class="countdown-label">秒</span>
                </div>
            </div>

            <!-- 纪念日文字 -->
            <p class="since-text">相识于 <span class="highlight">2023年5月20日</span></p>

            <!-- 入口按钮 -->
            <a href="timeline.html" class="entry-btn">
                <span>进入我们的故事</span>
                <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // 设置你们的纪念日（修改这个日期）
        const anniversaryDate = new Date('2023-05-20');

        // 初始化倒计时
        initCountdown(anniversaryDate);

        // 初始化粒子
        initParticles();
    </script>
</body>
</html>
